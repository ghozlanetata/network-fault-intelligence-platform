apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-fault-intelligence-platform
  namespace: nfi
  labels:
    app.kubernetes.io/name: network-fault-intelligence-platform
    app.kubernetes.io/part-of: network-fault-intelligence-platform
spec:
  # SQLite history is a local/demo persistence layer; keep one writer workload replica.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: network-fault-intelligence-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-fault-intelligence-platform
        app.kubernetes.io/part-of: network-fault-intelligence-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: network-fault-intelligence-platform:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nfi-api-config
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # /health/ready reports inference state in JSON while returning 200 in degraded mode.
          # Check that existing response so missing artifacts keep the pod out of service.
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import json, urllib.request;
                  response = urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2);
                  state = json.load(response);
                  raise SystemExit(0 if state.get('inference') == 'ready' else 1)
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
            successThreshold: 1
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: history
              mountPath: /app/data
            - name: models
              mountPath: /app/models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: nfi-history
        - name: models
          persistentVolumeClaim:
            claimName: nfi-models
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
